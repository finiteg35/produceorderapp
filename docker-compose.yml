services:
  produceorderapp:
    build: .
    restart: unless-stopped
    environment:
      - DATA_DIR=/data
    volumes:
      - ./data:/data
    networks:
      - traefik_proxy
    labels:
      - traefik.enable=true
      # Replace yourdomain.com with your actual domain before deploying.
      - traefik.http.routers.produceorderapp.rule=Host(`yourdomain.com`)
      - traefik.http.routers.produceorderapp.entrypoints=websecure
      - traefik.http.routers.produceorderapp.tls.certresolver=letsencrypt
      - traefik.http.services.produceorderapp.loadbalancer.server.port=8000

networks:
  traefik_proxy:
    external: true
