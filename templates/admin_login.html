{% extends "base.html" %}

{% block title %}Admin Login – Green Meadow Farms{% endblock %}

{% block nav %}
<nav class="navbar navbar-login">
  <div class="navbar-brand">
    <img src="https://github.com/user-attachments/assets/f5422071-54e3-4397-be4f-dedc8ca16422"
         alt="Green Meadow Farms"
         class="navbar-logo" />
    <span class="logo-text">Green Meadow Farms Order Portal</span>
  </div>
</nav>
{% endblock %}

{% block content %}
<div class="login-wrapper">
  <div class="login-card">
    <div class="login-header">
      <div class="login-icon">🔐</div>
      <h1>Admin Login</h1>
      <p class="login-subtitle">Green Meadow Farms – Admin Panel</p>
    </div>

    {% if error %}
    <div class="alert alert-error">
      <span class="alert-icon">⚠️</span> {{ error }}
    </div>
    {% endif %}

    <form method="POST" action="{{ url_for('admin_login') }}" class="login-form">
      <div class="form-group">
        <label for="username" class="form-label">Admin Username</label>
        <input
          type="text"
          id="username"
          name="username"
          class="form-input"
          placeholder="Enter admin username"
          autocomplete="username"
          required
          autofocus
        />
      </div>
      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          class="form-input"
          placeholder="Enter admin password"
          autocomplete="current-password"
          required
        />
      </div>
      <button type="submit" class="btn btn-primary btn-full">
        Login as Admin
      </button>
    </form>

    <div style="text-align:center; margin-top:1rem;">
      <a href="{{ url_for('login') }}" style="color:#4a7c59; font-size:0.9rem;">← Store Login</a>
    </div>
  </div>
</div>
{% endblock %}
