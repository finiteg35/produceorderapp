services:
  - type: web
    name: produce-backend
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "bash start.sh"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: produce-db
          property: connectionString
      - key: PORT
        value: 10000

databases:
  - name: produce-db
    plan: free