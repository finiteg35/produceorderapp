services:
  - type: web
    name: produce-backend
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: produce-db
          property: connectionString

databases:
  - name: produce-db
    plan: free