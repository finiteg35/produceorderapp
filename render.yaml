services:
  - type: web
    name: produce-backend
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "bash start.sh"
    envVars:
      - key: DATA_DIR
        value: /opt/render/project/src/data

  - type: web
    name: produce-web
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "bash -c 'gunicorn web_app:app --bind 0.0.0.0:${PORT:-5000}'"
    envVars:
      - key: API_URL
        value: https://produce-backend.onrender.com
      - key: FLASK_SECRET_KEY
        value: your-secret-key-here-change-in-production
