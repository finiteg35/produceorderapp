services:
  - type: web
    name: produce-backend
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: produce-db
          property: connectionString

databases:
  - name: produce-db
    plan: free
      # WEB FRONTEND (add this)
            - type: web
            name: produce-web
            env: python
            plan: free
            buildCommand: "pip install -r requirements.txt"
            startCommand: "gunicorn web_app:app"
            envVars:
              - key: API_URL
                value: https://produce-backend.onrender.com
              - key: FLASK_SECRET_KEY
                value: your-secret-key-here-change-in-production
              - key: PORT
                value: 10001

    databases:
      - name: produce-db
        plan: free