<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Sky gradient -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#87ceeb"/>
      <stop offset="60%" stop-color="#b0ddf5"/>
      <stop offset="100%" stop-color="#d4eefc"/>
    </linearGradient>
    <!-- Ground gradient -->
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="40%" stop-color="#388e3c"/>
      <stop offset="100%" stop-color="#1b5e20"/>
    </linearGradient>
    <!-- Field rows gradient -->
    <linearGradient id="fieldrow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2e7d32" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#388e3c" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#2e7d32" stop-opacity="0.6"/>
    </linearGradient>
    <!-- Overlay for readability -->
    <linearGradient id="overlay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1b2a" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0d1b2a" stop-opacity="0.70"/>
    </linearGradient>
    <!-- Hill gradient -->
    <linearGradient id="hills" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <!-- Far hill -->
    <linearGradient id="farhills" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#66bb6a"/>
      <stop offset="100%" stop-color="#43a047"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="1920" height="1080" fill="url(#sky)"/>

  <!-- Sun -->
  <circle cx="1600" cy="180" r="90" fill="#fff9c4" opacity="0.9"/>
  <circle cx="1600" cy="180" r="70" fill="#ffee58" opacity="0.95"/>

  <!-- Far hills -->
  <ellipse cx="300" cy="520" rx="550" ry="160" fill="url(#farhills)" opacity="0.7"/>
  <ellipse cx="950" cy="490" rx="650" ry="140" fill="url(#farhills)" opacity="0.65"/>
  <ellipse cx="1650" cy="510" rx="550" ry="150" fill="url(#farhills)" opacity="0.7"/>

  <!-- Near hills -->
  <ellipse cx="200" cy="600" rx="500" ry="180" fill="url(#hills)"/>
  <ellipse cx="960" cy="580" rx="700" ry="200" fill="url(#hills)"/>
  <ellipse cx="1750" cy="610" rx="500" ry="170" fill="url(#hills)"/>

  <!-- Ground base -->
  <rect y="600" width="1920" height="480" fill="url(#ground)"/>

  <!-- Crop rows (perspective lines) -->
  <g opacity="0.5">
    <path d="M 0 680 Q 960 650 1920 680" stroke="#1b5e20" stroke-width="18" fill="none"/>
    <path d="M 0 720 Q 960 690 1920 720" stroke="#1b5e20" stroke-width="18" fill="none"/>
    <path d="M 0 760 Q 960 730 1920 760" stroke="#1b5e20" stroke-width="18" fill="none"/>
    <path d="M 0 800 Q 960 770 1920 800" stroke="#1b5e20" stroke-width="18" fill="none"/>
    <path d="M 0 840 Q 960 810 1920 840" stroke="#1b5e20" stroke-width="18" fill="none"/>
    <path d="M 0 880 Q 960 850 1920 880" stroke="#1b5e20" stroke-width="18" fill="none"/>
    <path d="M 0 920 Q 960 900 1920 920" stroke="#1b5e20" stroke-width="18" fill="none"/>
    <path d="M 0 960 Q 960 940 1920 960" stroke="#1b5e20" stroke-width="18" fill="none"/>
    <path d="M 0 1000 Q 960 980 1920 1000" stroke="#1b5e20" stroke-width="18" fill="none"/>
    <path d="M 0 1040 Q 960 1020 1920 1040" stroke="#1b5e20" stroke-width="18" fill="none"/>
  </g>

  <!-- Perspective field dividers -->
  <g opacity="0.3">
    <path d="M 600 600 L 0 1080" stroke="#1b5e20" stroke-width="12" fill="none"/>
    <path d="M 800 600 L 100 1080" stroke="#1b5e20" stroke-width="12" fill="none"/>
    <path d="M 960 600 L 400 1080" stroke="#1b5e20" stroke-width="12" fill="none"/>
    <path d="M 1100 600 L 700 1080" stroke="#1b5e20" stroke-width="12" fill="none"/>
    <path d="M 1200 600 L 960 1080" stroke="#1b5e20" stroke-width="12" fill="none"/>
    <path d="M 1300 600 L 1200 1080" stroke="#1b5e20" stroke-width="12" fill="none"/>
    <path d="M 1400 600 L 1450 1080" stroke="#1b5e20" stroke-width="12" fill="none"/>
    <path d="M 1550 600 L 1750 1080" stroke="#1b5e20" stroke-width="12" fill="none"/>
    <path d="M 1700 600 L 1920 900" stroke="#1b5e20" stroke-width="12" fill="none"/>
  </g>

  <!-- Small clouds -->
  <g opacity="0.8">
    <ellipse cx="200" cy="160" rx="110" ry="42" fill="white"/>
    <ellipse cx="150" cy="175" rx="75" ry="36" fill="white"/>
    <ellipse cx="260" cy="175" rx="75" ry="36" fill="white"/>

    <ellipse cx="650" cy="120" rx="130" ry="48" fill="white"/>
    <ellipse cx="590" cy="138" rx="85" ry="38" fill="white"/>
    <ellipse cx="720" cy="138" rx="85" ry="38" fill="white"/>

    <ellipse cx="1100" cy="100" rx="100" ry="38" fill="white" opacity="0.9"/>
    <ellipse cx="1050" cy="115" rx="65" ry="30" fill="white" opacity="0.9"/>
    <ellipse cx="1160" cy="115" rx="65" ry="30" fill="white" opacity="0.9"/>

    <ellipse cx="1450" cy="200" rx="90" ry="36" fill="white" opacity="0.7"/>
    <ellipse cx="1400" cy="215" rx="60" ry="28" fill="white" opacity="0.7"/>
    <ellipse cx="1510" cy="215" rx="60" ry="28" fill="white" opacity="0.7"/>
  </g>

  <!-- Trees/bushes on horizon -->
  <g fill="#2e7d32">
    <!-- Left trees -->
    <polygon points="60,600 90,520 120,600" opacity="0.8"/>
    <polygon points="100,600 135,510 170,600" opacity="0.9"/>
    <polygon points="150,600 185,525 220,600" opacity="0.85"/>

    <!-- Right trees -->
    <polygon points="1700,600 1730,515 1760,600" opacity="0.8"/>
    <polygon points="1750,600 1790,505 1830,600" opacity="0.9"/>
    <polygon points="1810,600 1845,520 1880,600" opacity="0.85"/>
  </g>

  <!-- Barn (right side, small) -->
  <g transform="translate(1480, 500)">
    <rect x="0" y="60" width="100" height="80" fill="#c62828" opacity="0.9"/>
    <polygon points="-10,60 50,10 110,60" fill="#b71c1c" opacity="0.9"/>
    <rect x="38" y="100" width="24" height="40" fill="#5d4037" opacity="0.8"/>
    <rect x="10" y="75" width="20" height="20" fill="#fff9c4" opacity="0.6"/>
    <rect x="70" y="75" width="20" height="20" fill="#fff9c4" opacity="0.6"/>
  </g>

  <!-- Dark overlay for text readability -->
  <rect width="1920" height="1080" fill="url(#overlay)"/>
</svg>
